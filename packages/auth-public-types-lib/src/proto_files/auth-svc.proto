syntax = "proto3";
package rhyza.auth.service;

service RhyzaAuth {
	// Grant RPCs
	rpc CreateGrant(GrantRequest) returns (CreateGrantResponse) {}
	rpc GetGrant(GetGrantRequest) returns (Grant) {}
	rpc GetGrantsPage(GetGrantsPageRequest) returns (GetGrantsPageResponse) {}
	rpc ContinueGrant(ContinueGrantRequest) returns (ContinueGrantResponse) {}
	rpc RevokeGrant(RevokeGrantRequest) returns (RevokeGrantResponse) {}
	// Access Token RPCs
	rpc IntrospectToken(IntrospectTokenRequest) returns (IntrospectTokenResponse) {}
	rpc RotateToken(RotateTokenRequest) returns (RotateTokenResponse) {}
	rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse) {}
	// Interaction RPCs
	rpc StartInteraction(StartInteractionRequest) returns (StartInteractionResponse) {}
	rpc FinishInteraction(FinishInteractionRequest) returns (FinishInteractionResponse) {}
	rpc AcceptInteraction(AcceptInteractionRequest)  returns (HandleInteractionChoiceResponse) {}
	rpc RejectInteraction(RejectInteractionRequest) returns (HandleInteractionChoiceResponse) {}
}

message AccessItem {
	string type = 1;
	AccessLimits limits = 2;
	repeated string actions = 3;
	string identifier = 4;
}

message AccessToken {
	string value = 1;
	string management_id = 2;
	int32 expires_in = 3;
	string revoked_at = 4; // Date string
}

message Interaction {
	string interact_ref = 1;
	string client_nonce = 2;
	string state = 3;
	int64 expires_at = 4;
}

message Grant {
	string id = 1;
	repeated string start_methods = 2;
	string continue_token = 3;
	string continue_id = 4;
	string interaction_nonce =5;
	string state = 6;
	string finalization_reason = 7;
	string client = 8;
	repeated SubjectId subject_ids = 9;
	repeated AccessItem accesses = 10;
	string finish_method = 11;
	string finish_uri = 12;
	string finish_nonce = 13;
	Interaction interaction = 14;
	string last_continued_at = 15; // Date string
	string created_at = 16; // Date string; the pagination sort key
}

message AccessLimits {
	string receiver = 1;
	string debit_amount_value = 2;
	string receive_amount_value = 3;
	string asset_code = 4;
	int32 asset_scale = 5;
	string interval = 6;
}

message GrantRequestFinish {
	string finish = 1;
	string uri = 2;
	string nonce = 3;
}

message SubjectId {
	string format = 1;
	string id = 2;
}

message SignatureData {
	string url = 1;
	string method = 2;
	string body = 3;
	string headers = 4; // JSON string
	string kid = 5;
}

message GrantRequest {
	repeated AccessItem access = 1;
	string client = 2;
	repeated SubjectId subject_ids = 3;
	repeated string start = 4;
	GrantRequestFinish finish = 5;
	SignatureData signature_data = 6;
}

message CreateGrantResponse {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
	optional string interaction_nonce = 4;
	optional string access_token_value = 5;
	optional string access_token_management_id = 6;
	optional int32 access_token_expires_in = 7;
	repeated AccessItem access = 8;
	repeated SubjectId sub_ids = 9;
}

message GetGrantRequest {
	string id = 1;
}

enum SortOrder {
	SORT_ORDER_UNSPECIFIED = 0;
	SORT_ORDER_ASC = 1;
	SORT_ORDER_DESC = 2;
}

message GetGrantsPageRequest {
	// Filters by the end user whose access was granted (accesses[].identifier),
	// not by the requesting client; omit to list across all.
	optional string identifier = 1;
	// Filters by grant state; omit to list across all.
	optional string state = 2;
	// Opaque cursor from a previous page's start_cursor/end_cursor.
	optional string cursor = 3;
	// Page size; 0 means server default (20). Server clamps to 100.
	uint32 limit = 4;
	// false = forward (first/after), true = backward (last/before).
	bool backwards = 5;
	// Ordering by createdAt. Unspecified means server default.
	SortOrder sort_order = 6;
}

message GetGrantsPageResponse {
	repeated Grant grants = 1;
	bool has_next_page = 2;
	bool has_previous_page = 3;
	// Opaque cursors for the previous / next page.
	optional string start_cursor = 4;
	optional string end_cursor = 5;
}

message ContinueGrantRequest {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
	optional string interact_ref = 4;
	SignatureData signature_data = 5;
}

message ContinueGrantResponse {
	string id = 1;
	string state = 2;
	optional string access_token_value = 3;
	optional string access_token_management_id = 4;
	optional int32 access_token_expires_in = 5;
	repeated AccessItem access = 6;
	string continue_id = 7;
	string continue_token = 8;
}

message RevokeGrantRequest {
	string id = 1;
	string continue_id = 2;
	string continue_token = 3;
	SignatureData signature_data = 4;
}

message RevokeGrantResponse {
	string id = 1;
}

message IntrospectTokenResponse {
	bool active = 1;
	string grant_id = 2;
	repeated AccessItem access = 3;
}

message IntrospectTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	repeated AccessItem access = 3;
}

message RotateTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	string management_id = 3;
	SignatureData signature_data = 4;
}

message RotateTokenResponse {
	string grant_id = 1;
	string new_access_token_value = 2;
	string new_access_token_management_id = 3;
	int32 new_access_token_expires_in = 4;
	repeated AccessItem access = 5;
}

message RevokeTokenRequest {
	string id = 1; // grant id
	string token_value = 2;
	string management_id = 3;
	SignatureData signature_data = 4;
}

message RevokeTokenResponse {
	string id = 1;
}

message StartInteractionRequest {
	string id = 1;
}

message StartInteractionResponse {
	string id = 1;
	string nonce = 2;
	string client_uri = 3;
	string client_name = 4;
}

message FinishInteractionRequest {
	string id = 1; // grant id
	string nonce = 2;
}

message FinishInteractionResponse {
	string id = 1; // grant id
	string interact_nonce = 2;
	string client_nonce = 3;
	string interact_ref = 4;
	string finish_uri = 5;
}

message HandleInteractionChoiceResponse {
	bool success = 1;
}

message AcceptInteractionRequest {
	string id = 1; // grant id
}

message RejectInteractionRequest {
	string id = 1; // grant id
}
