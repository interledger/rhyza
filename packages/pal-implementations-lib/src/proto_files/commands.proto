syntax = "proto3";

// ledger commands
message PbCreateLedgerCmdPayload{
  string ledger_id = 1;
}

message PbCreateLedgerAccountCmdPayload{
  string account_id = 1;
  string asset_code = 2;
  string name = 3;
  optional uint32 asset_display_scale = 4;
}

message PbCreateLedgerAccountForAssetCmdPayload{
  string account_id = 1;
  string asset_code = 2;
}

message PbCreateLedgerAccountsForPeerCmdPayload{
  string peer_id = 1;
  string asset_code = 2;
  string peer_liquidity_account_id = 3;
  string peer_clearing_account_id = 4;
  string ase_liquidity_account_id = 5;
  string ase_clearing_account_id = 6;
  string suspense_account_id = 7;
}

message PbPostTransactionCmdPayload{
  string id = 1;
  string debited_account_id = 2;
  string credited_account_id = 3;
  string amount =4;
  uint32 amount_scale = 5;
}

// same for CheckBalanceAndReserveTransferCmdPayload and ReserveTransferCmdPayload
message PbCheckBalanceAndReserveOrReserveTransferCmdPayload{
  string request_id = 1;
  string transfer_id = 2;
  string peer_id = 3;
  string amount = 4;
  uint32 amount_scale = 5;
  string transfer_direction = 6;// only 'INCOMING' | 'OUTGOING';
  string payment_intent_id = 7;
  string payment_id = 8;
}

// same for CommitTransferCmdPayload and RejectTransferCmdPayload
message PbCommitOrRejectCmdPayload{
  string request_id = 1;
  string transfer_id = 2;
  string transfer_direction = 3;// only 'INCOMING' | 'OUTGOING';
  string payment_intent_id = 4;
  string payment_id = 5;
}

// same for all liquidity commands DepositToPeerCmd, WithdrawFromPeerCmd, DepositToAseCmd and WithdrawFromAseCmd
message PbLiquidityManagementCmdPayload{
  string request_id = 1;
  string peer_id = 2;
  string asset_code = 3;
  string amount = 4;
  uint32 amount_scale = 5;
  optional string external_id = 6;
}
