syntax = "proto3";
package rafiki.pal.svc;

import "google/protobuf/empty.proto";

service PalGrpc {
  rpc CreateAsset(PbCreateAssetRequest) returns (google.protobuf.Empty);
  rpc GetAsset(PbGetAssetRequest) returns (PbGetAssetResponse);

  rpc CreateWalletAddress(PbCreateWalletAddressRequest) returns (PbCreateWalletAddressResponse);
  rpc GetWalletAddresses(PbGetWalletAddressesRequest) returns (PbGetWalletAddressesResponse);

  rpc ResolveWalletAddressAlias(PbResolveWalletAddressAliasRequest) returns (PbResolveWalletAddressAliasResponse);
  rpc CreateWalletAddressAlias(PbCreateWalletAddressAliasRequest) returns (google.protobuf.Empty);

  rpc CreatePeer(PbCreatePeerRequest) returns (google.protobuf.Empty);
  rpc GetPeer(PbGetPeerRequest) returns (PbGetPeerResponse);
  rpc GetPeerByIlpAddress(PbGetPeerByIlpAddressRequest) returns (PbGetPeerResponse);
  rpc SetPeerCommunicationMethod(PbSetPeerCommunicationMethodRequest) returns (google.protobuf.Empty);
  rpc ActivatePeer(PbActivatePeerRequest) returns (google.protobuf.Empty);
  rpc DeactivatePeer(PbDeactivatePeerRequest) returns (google.protobuf.Empty);

  // peer fx
  rpc GetFxRate(PbGetFxRateRequest) returns (PbGetFxRateResponse);
  rpc SetFxRate(PbSetFxRateRequest) returns (google.protobuf.Empty);

  // ledger queries
  rpc GetLedgerAccounts(PbGetLedgerAccountsRequest) returns (PbGetLedgerAccountsResponse);
}

/*
Asset messages
*/
message PbCreateAssetRequest{
  string code = 1;
  uint32 scale = 2;
}

message PbGetAssetRequest{
  string code = 1;
}
message PbGetAssetResponse{
  optional PbAsset asset = 1;
}
message PbAsset{
  string code = 1;
  uint32 scale = 2;
  optional string ledger_account_id = 3;
}

/*
Wallet Address messages
*/

message PbCreateWalletAddressRequest {
  string path_name = 1;
  string asset_code = 2;
  string public_name = 3;
  optional bool is_active = 4;
  optional string domain = 5;
}

message PbCreateWalletAddressResponse {
  string path_name = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
  optional string domain = 6;
}

message PbGetWalletAddressesRequest {
  repeated string ids = 1;
}

message PbGetWalletAddressesResponse {
  repeated PbSingleWalletAddressResponse wallet_addresses = 1;
}
message PbSingleWalletAddressResponse {
  string id = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
}

/*
Wallet Address Aliases messages
*/
message PbResolveWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain =2;
}
message PbResolveWalletAddressAliasResponse {
  optional PbResolveWalletAddressNonEmptyResponse alias = 1;
}
message PbResolveWalletAddressNonEmptyResponse {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}

message PbCreateWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}

/*
Peer messages
*/
message PbCreatePeerRequest{
  string id = 1;
  string name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  PbPeerCommsMethodDefinition comms_method_definition = 5;
}

message PbGetPeerRequest{
  string id = 1;
}
message PbGetPeerResponse{
  optional PbPeer peer = 1;
}
message PbPeer{
  string id = 1;
  string name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool active = 5;
  optional PbPeerLedgerAccounts ledger_accounts = 6;
  optional PbPeerCommsMethodDefinition comms_method_definition = 7;
  repeated PbPeerFxRate fx_rates = 8;
}

message PbPeerCommsMethodDefinition{
  string comms_type = 1; // for now can only be ILP
  string static_address = 2;
}
message PbPeerLedgerAccounts{
  string peer_liquidity_account_id = 1;
  string peer_clearing_account_id = 2;
  string ase_liquidity_account_id = 3;
  string ase_clearing_account_id = 4;
  string suspense_account_id = 5;
}
message PbPeerFxRate{
  string source_asset_code = 1;
  string destination_asset_code = 2;
  double rate = 3;
  uint64 expires_at = 4;
  bool fetched_from_ase = 5;
  optional uint64 fetched_at = 6;
}
message PbGetPeerByIlpAddressRequest{
  string address = 1;
}
message PbSetPeerCommunicationMethodRequest{
  string peer_id = 1;
  PbPeerCommsMethodDefinition comms_method = 2;
}
message PbActivatePeerRequest{
  string peer_id = 1;
}
message PbDeactivatePeerRequest{
  string peer_id = 1;
}

// fx messages
message PbGetPeerFxRateFromSourceAssetRequest{
  string peer_id = 1;
  string source_asset_code = 2;
}

message PbGetPeerFxRateToDestinationAssetRequest{
  string peer_id = 1;
  string destination_asset_code = 2;
}

message PbGetIntraAseFxRateRequest{
  string source_asset_code = 1;
  string destination_asset_code = 2;
}

message PbGetFxRateRequest{
  oneof request {
    PbGetPeerFxRateFromSourceAssetRequest from_source_request = 1;
    PbGetPeerFxRateToDestinationAssetRequest to_destination_request = 2;
    PbGetIntraAseFxRateRequest intra_ase_request = 3;
  };
}

message PbGetFxRateResponse{
  optional double rate = 1;
}

message PbSetFxRateRequest{
  string source_asset_code = 1;
  string destination_asset_code = 2;
  double rate = 3;
  optional string peer_id = 4;
  optional int64 rate_ttl_secs = 5;
}

/*
Liquidity messages
*/

// query messages
message PbGetLedgerAccountsRequest{
  repeated string account_ids = 1;
}

message PbLedgerAccount {
  string id = 1;
  string asset_code = 2;
  uint32 asset_display_scale = 3;
  string name = 4;
  string debited_amount = 5;
  string credited_amount = 6;
  optional string external_id = 7;
}

message PbGetLedgerAccountsResponse{
  repeated PbLedgerAccount accounts = 1;
}
