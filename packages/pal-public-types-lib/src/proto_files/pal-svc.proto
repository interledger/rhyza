syntax = "proto3";
package rafiki.pal.svc;

import "google/protobuf/empty.proto";

service PalGrpc {
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse);
  rpc GetAsset(GetAssetRequest) returns (GetAssetResponse);

  rpc CreateWalletAddress(CreateWalletAddressRequest) returns (CreateWalletAddressResponse);
  rpc GetWalletAddresses(GetWalletAddressesRequest) returns (GetWalletAddressesResponse);

  rpc ResolveWalletAddressAlias(ResolveWalletAddressAliasRequest) returns (ResolveWalletAddressAliasResponse);
  rpc CreateWalletAddressAlias(CreateWalletAddressAliasRequest) returns (google.protobuf.Empty);
}

/*
Asset messages
*/
message CreateAssetRequest{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}
message CreateAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}

message GetAssetRequest{
  string code = 1;
}
message GetAssetResponse{
  optional GetNonEmptyAssetResponse asset = 1;
}
message GetNonEmptyAssetResponse{
  string code = 1;
  uint32 scale = 2;
  optional uint64 liquidity_low_threshold = 3;
  optional uint64 liquidity_high_threshold = 4;
}

/*
Wallet Address messages
*/

message CreateWalletAddressRequest {
  string path_name = 1;
  string asset_code = 2;
  string public_name = 3;
  optional bool is_active = 4;
  optional string domain = 5;
}

message CreateWalletAddressResponse {
  string path_name = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
  optional string domain = 6;
}

message GetWalletAddressesRequest {
  repeated string ids = 1;
}

message GetWalletAddressesResponse {
  repeated SingleWalletAddressResponse wallet_addresses = 1;
}
message SingleWalletAddressResponse {
  string id = 1;
  string public_name = 2;
  string asset_code = 3;
  uint32 asset_scale = 4;
  bool is_active = 5;
}

/*
Wallet Address Aliases messages
*/
message ResolveWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain =2;
}
message ResolveWalletAddressAliasResponse {
  optional ResolveWalletAddressNonEmptyResponse alias = 1;
}
message ResolveWalletAddressNonEmptyResponse {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}

message CreateWalletAddressAliasRequest {
  string path_name = 1;
  optional string domain = 2;
  string wallet_address_id = 3;
}
