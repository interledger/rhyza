openapi: 3.1.0
info:
  title: Rafiki Admin API
  version: 0.0.0
tags: []
paths:
  /assets:
    post:
      operationId: Assets_createAsset
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetCreateResponse'
        '409':
          description: Asset already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
  /wallet-addresses:
    post:
      operationId: WalletAddresses_createWalletAddress
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddressCreateResponse'
        '409':
          description: Wallet address already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressCreate'
  /payment-intents:
    post:
      operationId: PaymentIntents_createPaymentIntent
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentCreateResponse'
        '404':
          description: Wallet address not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentIntentCreate'
  /payment-intents/{id}:
    get:
      operationId: PaymentIntents_getPaymentIntent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntent'
        '404':
          description: Payment intent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /quotes:
    post:
      operationId: Quotes_createQuote
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Either paymentIntentId or paymentIntentUrl is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Wallet address not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteCreate'
  /payments:
    post:
      operationId: Payments_createPayment
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreateResponse'
        '404':
          description: Wallet address not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
  /payment-intents/{intentId}/payments/{id}:
    get:
      operationId: Payments_getPayment
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Payment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payment-intents/{intentId}/payments/{id}/approve:
    post:
      operationId: Payments_approvePayment
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
  /payment-intents/{intentId}/payments/{id}/cancel:
    post:
      operationId: Payments_cancelPayment
      parameters:
        - name: intentId
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                properties:
                  id:
                    type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCancel'
components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    AssetCreate:
      type: object
      required:
        - code
        - scale
      properties:
        code:
          type: string
        scale:
          type: number
        liquidityLowThreshold:
          type: integer
        liquidityHighThreshold:
          type: integer
    AssetCreateResponse:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    WalletAddressCreate:
      type: object
      required:
        - address
        - assetCode
        - publicName
      properties:
        address:
          type: string
        assetCode:
          type: string
        publicName:
          type: string
        isActive:
          type: boolean
    WalletAddressCreateResponse:
      type: object
      required:
        - address
      properties:
        address:
          type: string
    PaymentIntentCreate:
      type: object
      required:
        - walletAddress
      properties:
        id:
          type: string
        walletAddress:
          type: string
        incomingAmount:
          type: number
        expiresAt:
          type: string
          format: date-time
        metadata:
          type: string
    PaymentIntentCreateResponse:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        openPaymentsUrl:
          type: string
    Amount:
      type: object
      required:
        - value
        - assetCode
        - assetScale
      properties:
        value:
          type: string
        assetCode:
          type: string
        assetScale:
          type: number
    PaymentIntent:
      type: object
      required:
        - id
        - state
        - destination
        - walletAddress
        - receivedAmount
      properties:
        id:
          type: string
        state:
          type: string
        destination:
          type: string
        walletAddress:
          type: string
        incomingAmount:
          $ref: '#/components/schemas/Amount'
        receivedAmount:
          $ref: '#/components/schemas/Amount'
        expiresAt:
          type: string
          format: date-time
        destinationIlpAddress:
          type: string
    QuoteCreate:
      type: object
      required:
        - walletAddress
      properties:
        id:
          type: string
        walletAddress:
          type: string
        paymentIntentId:
          type: string
        paymentIntentUrl:
          type: string
        debitAmount:
          type: string
        receiveAmount:
          type: string
    Quote:
      type: object
      required:
        - id
        - paymentIntentId
        - senderWalletAddress
        - senderWalletAddressId
        - expiresAt
        - debitAmount
        - receiveAmount
        - exchangeRate
      properties:
        id:
          type: string
        paymentIntentId:
          type: string
        senderWalletAddress:
          type: string
        senderWalletAddressId:
          type: string
        expiresAt:
          type: string
          format: date-time
        debitAmount:
          type: string
        receiveAmount:
          type: string
        exchangeRate:
          type: number
    PaymentCreate:
      type: object
      required:
        - walletAddress
        - paymentIntentId
      properties:
        id:
          type: string
        walletAddress:
          type: string
        paymentIntentId:
          type: string
        quoteId:
          type: string
        debitAmount:
          type: number
    PaymentCreateResponse:
      type: object
      required:
        - id
        - paymentIntentId
      properties:
        id:
          type: string
        paymentIntentId:
          type: string
    PaymentCancel:
      type: object
      properties:
        reason:
          type: string
    Payment:
      type: object
      required:
        - id
        - state
        - senderWalletAddress
        - assetCode
        - assetScale
        - debitAmount
        - receiveAmount
        - sentAmount
      properties:
        id:
          type: string
        state:
          type: string
        senderWalletAddress:
          type: string
        assetCode:
          type: string
        assetScale:
          type: number
        quoteId:
          type: string
        debitAmount:
          type: string
        receiveAmount:
          type: string
        sentAmount:
          type: string
