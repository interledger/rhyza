openapi: 3.1.0
info:
  title: Rafiki Admin API
  version: 0.0.0
tags: []
paths:
  /assets:
    post:
      operationId: Assets_createAsset
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
  /assets/{code}:
    get:
      operationId: Assets_getAsset
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /wallet-addresses:
    post:
      operationId: WalletAddresses_createWalletAddress
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddress'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAddressCreate'
  /wallet-addresses/{address}:
    get:
      operationId: WalletAddresses_getWalletAddress
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAddress'
components:
  schemas:
    Asset:
      type: object
      required:
        - code
        - scale
      properties:
        code:
          type: string
        scale:
          type: number
    AssetCreate:
      type: object
      required:
        - code
        - scale
      properties:
        code:
          type: string
        scale:
          type: number
    WalletAddress:
      type: object
      required:
        - address
        - assetScale
        - assetCode
        - publicName
      properties:
        address:
          type: string
        publicName:
          type: string
        assetCode:
          type: string
        assetScale:
          type: number
        isActive:
          type: boolean
    WalletAddressCreate:
      type: object
      required:
        - address
        - assetCode
        - publicName
      properties:
        address:
          type: string
        assetCode:
          type: string
        publicName:
          type: string
        isActive:
          type: boolean
