syntax = "proto3";
package rafiki.payments.service;

// Service for managing payment resources.
service PaymentsGrpc {
  // Creates a new incoming payment.
  rpc CreateIncomingPayment(CreateIncomingPaymentRequest) returns (CreateIncomingPaymentResponse);

  // Creates a new quote.
  rpc CreateQuote(CreateQuoteRequest) returns (CreateQuoteResponse);

  // Creates a new outgoing payment.
  rpc CreateOutgoingPayment(CreateOutgoingPaymentRequest) returns (CreateOutgoingPaymentResponse);

  // Approves an existing outgoing payment.
  rpc ApproveOutgoingPayment(ApproveOutgoingPaymentRequest) returns (ApproveOutgoingPaymentResponse);

  // Fetches a payment intent by ID.
  rpc GetPaymentIntent(GetPaymentIntentRequest) returns (GetPaymentIntentResponse);
}

/*
 * Incoming Payment messages
 */

// Request to create a new incoming payment.
message CreateIncomingPaymentRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 3;
  optional uint64 incoming_amount = 4;
  optional string expires_at = 5;
  optional string metadata = 6;
}

// Response containing the ID of the created incoming payment.
message CreateIncomingPaymentResponse {
  string id = 1;
}

/*
 * Quote messages
 */

// Request to create a new quote.
message CreateQuoteRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 3;
  string incoming_payment_id = 4;
  optional uint64 debit_amount = 5;
  optional uint64 receive_amount = 6;
  optional string remote_url = 7;
}

// Response containing the ID of the created quote and the resolved payment intent ID.
message CreateQuoteResponse {
  string id = 1;
  string payment_intent_id = 2;
}

/*
 * Outgoing Payment messages
 */

// Request to create a new outgoing payment.
message CreateOutgoingPaymentRequest {
  string id = 1;
  string wallet_address_id = 2;
  string wallet_address = 3;
  string incoming_payment_id = 4;
  optional string quote_id = 5;
  optional uint64 debit_amount = 6;
}

// Response containing the ID of the created outgoing payment.
message CreateOutgoingPaymentResponse {
  string id = 1;
}

// Request to approve an outgoing payment.
message ApproveOutgoingPaymentRequest {
  string id = 1;
  string incoming_payment_id = 2;
}

// Response confirming the approval of the outgoing payment.
message ApproveOutgoingPaymentResponse {
  string id = 1;
}

/*
 * Get Payment Intent messages
 */

// Request to fetch a payment intent by ID.
message GetPaymentIntentRequest {
  string id = 1;
}

// Response containing the payment intent details.
message GetPaymentIntentResponse {
  string id = 1;
  string wallet_address = 2;
  string state = 3;
  string destination = 4;
  optional uint64 incoming_amount = 5;
  uint64 received_amount = 6;
  string asset_code = 7;
  uint32 asset_scale = 8;
  optional string expires_at = 9;
  optional string destination_ilp_address = 10;
}

