openapi: 3.1.0
info:
  title: Rafiki Webhooks
  version: 0.0.0
webhooks:
  paymentIntentCreated:
    post:
      summary: Payment intent created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent created
  paymentCreated:
    post:
      summary: Payment created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment created
  paymentCompleted:
    post:
      summary: Payment completed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment completed
  paymentFailed:
    post:
      summary: Payment failed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEventError'
      responses:
        '200':
          description: Payment failed

components:
  schemas:
    webhookEvent:
      type: object
      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - payment_intent.created
            - payment.created
            - payment.completed
            - payment.failed
        data:
          type: object

    paymentIntentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment_intent.created
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - expiresAt
                - receiveAmount
              properties:
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - COMPLETED
                walletAddressId:
                  type: string
                  format: uuid
                incomingAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time

    paymentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.created
                - payment.completed
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - debitAmount
                - sentAmount
                - receiveAmount
                - state
              properties:
                id:
                  type: string
                  format: uuid
                walletAddressId:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - COMPLETED
                    - FAILED
                paymentIntentId:
                  type: string
                  format: uri
                debitAmount:
                  $ref: '#/components/schemas/amount'
                sentAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
    paymentEventError:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.failed
            data:
              type: object
              required:
                - id
                - paymentIntentId
                - errorName
                - message
              properties:
                id:
                  type: string
                  format: uuid
                paymentIntentId:
                  type: string
                  format: uuid
                errorName:
                  type: string
                message:
                  type: string
    amount:
      type: object
      required:
        - value
        - assetCode
        - assetScale
      properties:
        value:
          type: string
        assetCode:
          type: string
        assetScale:
          type: integer
