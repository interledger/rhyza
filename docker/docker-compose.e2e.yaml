# E2e stack. Compose does not build or pull. A missing image fails the run.
#
# Images are rhyza-<service>, plus an optional architecture suffix and version tag:
#   (no env)                          rhyza-admin-api-service
#   TARGET_ARCH=amd64 VERSION=v1.2.3 rhyza-admin-api-service-amd64:v1.2.3
#
# Local images, built as rhyza-<service>:
#   pnpm docker:build
#   pnpm e2e

name: rhyza

include:
  - path: docker-compose.yaml
  - path: docker-compose.node-b.yaml

services:
  admin-api-service:
    image: rhyza-admin-api-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  open-payments-resource-service:
    image: rhyza-open-payments-resource-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  open-payments-auth-service:
    image: rhyza-open-payments-auth-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  # Not part of the e2e run.
  http-signature-service:
    profiles: [not-in-release-e2e]
    build: !reset null

  pal-api-service:
    image: rhyza-pal-api-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  pal-ledger-command-handler-service:
    image: rhyza-pal-ledger-command-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  pal-event-handler-service:
    image: rhyza-pal-event-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  payments-api-service:
    image: rhyza-payments-api-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  payments-command-handler-service:
    image: rhyza-payments-command-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  payments-event-handler-service:
    image: rhyza-payments-event-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  notifications-command-handler-service:
    image: rhyza-notifications-command-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  notifications-event-handler-service:
    image: rhyza-notifications-event-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  ilp-connector-service:
    image: rhyza-ilp-connector-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  ase-mock-service:
    image: rhyza-ase-mock-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  ilp-command-handler-service:
    image: rhyza-ilp-command-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  ilp-api-service:
    image: rhyza-ilp-api-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  ilp-event-handler-service:
    image: rhyza-ilp-event-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  auth-api-service:
    image: rhyza-auth-api-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  idp-interaction-service:
    image: rhyza-idp-interaction-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  auth-command-handler-service:
    image: rhyza-auth-command-handler-service${TARGET_ARCH:+-$TARGET_ARCH}${VERSION:+:$VERSION}
    build: !reset null
    pull_policy: never

  # Node B runs the same images as node A. Ports stay as set in docker-compose.node-b.yaml.
