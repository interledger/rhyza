# Kafka Docker Image Usage Guide: https://github.com/apache/kafka/blob/trunk/docker/examples/README.md

services:
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  mongodb:
    image: mongo:7.0.8
    container_name: mongodb
    restart: unless-stopped
    command: ['mongod', '--wiredTigerCacheSizeGB', '8'] # Cap WiredTiger to 8GB RAM for tests
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongoPass
    ports:
      - 27017:27017
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 27017 || exit 1']
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 20s

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    restart: unless-stopped
    ports:
      - '9308:9308'
    command:
      # Tell the exporter how to connect to your cluster brokers
      - --kafka.server=kafka-1:19092
      - --kafka.server=kafka-2:19092
      - --kafka.server=kafka-3:19092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3

  # Helper to download the JMX exporter agent on start
  jmx-exporter-download:
    image: alpine:latest
    container_name: jmx-exporter-download
    volumes:
      - jmx-shared:/shared
    command: >
      wget -O /shared/jmx_prometheus_javaagent.jar
      https://repo1.maven.org/maven2/io/prometheus/jmx/jmx_prometheus_javaagent/1.0.1/jmx_prometheus_javaagent-1.0.1.jar

  kafka-1:
    image: apache/kafka:latest
    hostname: kafka-1
    container_name: kafka-1
    restart: unless-stopped
    ports:
      - 29092:9092
      - 29405:9405 # Prometheus metrics endpoint
    depends_on:
      jmx-exporter-download:
        condition: service_completed_successfully
    volumes:
      - jmx-shared:/usr/share/jmx-exporter
      - ../kafka-config.yaml:/usr/share/jmx-exporter/kafka-config.yaml
    environment:
      KAFKA_OPTS: '-javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent.jar=9405:/usr/share/jmx-exporter/kafka-config.yaml'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_MESSAGE_MAX_BYTES: 41943040
      KAFKA_REPLICA_FETCH_MAX_BYTES: 41943040
      KAFKA_GROUP_CONSUMER_MAX_SESSION_TIMEOUT_MS: 15000
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MAX_HEARTBEAT_INTERVAL_MS: 5000

  kafka-2:
    image: apache/kafka:latest
    hostname: kafka-2
    container_name: kafka-2
    restart: unless-stopped
    ports:
      - 39092:9092
      - 39405:9405 # Prometheus metrics endpoint
    depends_on:
      jmx-exporter-download:
        condition: service_completed_successfully
    volumes:
      - jmx-shared:/usr/share/jmx-exporter
      - ../kafka-config.yaml:/usr/share/jmx-exporter/kafka-config.yaml
    environment:
      KAFKA_OPTS: '-javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent.jar=9405:/usr/share/jmx-exporter/kafka-config.yaml'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_MESSAGE_MAX_BYTES: 41943040
      KAFKA_REPLICA_FETCH_MAX_BYTES: 41943040
      KAFKA_GROUP_CONSUMER_MAX_SESSION_TIMEOUT_MS: 15000
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MAX_HEARTBEAT_INTERVAL_MS: 5000

  kafka-3:
    image: apache/kafka:latest
    hostname: kafka-3
    container_name: kafka-3
    restart: unless-stopped
    ports:
      - 49092:9092
      - 49405:9405 # Prometheus metrics endpoint
    depends_on:
      jmx-exporter-download:
        condition: service_completed_successfully
    volumes:
      - jmx-shared:/usr/share/jmx-exporter
      - ../kafka-config.yaml:/usr/share/jmx-exporter/kafka-config.yaml
    environment:
      KAFKA_OPTS: '-javaagent:/usr/share/jmx-exporter/jmx_prometheus_javaagent.jar=9405:/usr/share/jmx-exporter/kafka-config.yaml'
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_MESSAGE_MAX_BYTES: 41943040
      KAFKA_REPLICA_FETCH_MAX_BYTES: 41943040
      KAFKA_GROUP_CONSUMER_MAX_SESSION_TIMEOUT_MS: 15000
      KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 10000
      KAFKA_GROUP_CONSUMER_MAX_HEARTBEAT_INTERVAL_MS: 5000

  init-kafka:
    image: apache/kafka:4.0.0
    container_name: init-kafka
    depends_on:
      kafka-3:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    working_dir: /opt/kafka/bin/
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --list
      echo -e '\nCreating kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --topic audits
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --topic logs
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic payment-commands
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic payment-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic asset-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic peer-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ledger-commands
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ledger-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ledger-snapshot-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ledger-state-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ledger-timer-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic wallet-address-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic fxrate-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ilp-domain-events
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ilp-commands
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic ilp-connector-commands
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --create --if-not-exists --partitions 3 --replication-factor 2 --topic notification-commands
      echo -e '\nSuccessfully created the following topics:'
      ./kafka-topics.sh --bootstrap-server kafka-3:19092 --list
      "
  redpanda-console:
    image: redpandadata/console
    container_name: redpanda-console
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka-1:19092
    ports:
      - 8080:8080

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: otel-collector
    command: '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ../otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'
      - '4318:4318'

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ../prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - '9090:9090'

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    command: '-config.file=/etc/tempo.yaml'
    ports:
      - '3200:3200'
    volumes:
      - ../tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - '4501:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/dashboards
      - ../grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  mongodb-data:
  grafana-data:
  tempo-data:
  jmx-shared:
