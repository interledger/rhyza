name: rafiki-v2
services:
  admin-api-service:
    build:
      context: ../
      dockerfile: ./packages/admin-api-service/Dockerfile
    restart: always
    environment:
      PAL_GRPC_URL: pal-api-service:50051
      PAYMENTS_GRPC_URL: payments-api-service:50052
      OPEN_PAYMENTS_URL: http://open-payments-resource-service:3002
      ILP_GRPC_URL: ilp-api-service:50053
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
      KAFKA_URL: kafka:19092
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
      pal-api-service:
        condition: service_started
      payments-api-service:
        condition: service_started
      ilp-api-service:
        condition: service_started
    networks:
      rafiki-v2:

  open-payments-resource-service:
    build:
      context: ../
      dockerfile: ./packages/open-payments-resource-service/Dockerfile
    restart: always
    environment:
      PAL_GRPC_URL: pal-api-service:50051
      PAYMENTS_GRPC_URL: payments-api-service:50052
      OPEN_PAYMENTS_RESOURCE_SERVICE_URL: http://open-payments-resource-service:3002
      OPEN_PAYMENTS_AUTH_SERVICE_URL: http://localhost:3003
      STREAM_SERVER_SECRET: cmFmaWtpLXYyLWRldi1zdHJlYW0tc2VjcmV0LTAwMDE
      ILP_ADDRESS: private.rafiki.a
    ports:
      - '3002:3002'
    depends_on:
      pal-api-service:
        condition: service_started
      payments-api-service:
        condition: service_started
    networks:
      rafiki-v2:
        # TODO: temporary. peer-open-payments-svc is a single-node loopback alias used by
        # benchmark-remote.js against `docker:up` to simulate a remote peer (the OP server is
        # otherwise reached by its real service name, open-payments-resource-service). Remove
        # once remote testing moves to the real two-node setup (docker:peers / Node B).
        aliases:
          - peer-open-payments-svc

  open-payments-auth-service:
    build:
      context: ../
      dockerfile: ./packages/open-payments-auth-service/Dockerfile
    restart: always
    environment:
      AUTH_GRPC_URL: auth-api-service:50054
      OPEN_PAYMENTS_AUTH_SERVICE_URL: http://localhost:3003
    ports:
      - '3003:3003'
    depends_on:
      auth-api-service:
        condition: service_started
    networks:
      - rafiki-v2

  http-signature-service:
    build:
      context: ../
      dockerfile: ./packages/http-signature-service/Dockerfile
    restart: always
    environment:
      HOST: http-signature-service
      PORT: 3010
    ports:
      - '3010:3010'
    networks:
      - rafiki-v2

  pal-api-service:
    build:
      context: ../
      dockerfile: ./packages/pal-api-service/Dockerfile
    restart: always
    environment:
      MONGO_URL: mongodb://root:mongoPass@mongodb:27017/
      KAFKA_URL: kafka:19092
    ports:
      - '50051:50051'
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rafiki-v2
  pal-ledger-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/pal-ledger-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      REDIS_URL: redis:6379
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rafiki-v2
  pal-event-handler-service:
    build:
      context: ../
      dockerfile: ./packages/pal-event-handler-service/Dockerfile
    restart: always
    environment:
      MONGO_URL: mongodb://root:mongoPass@mongodb:27017/
      KAFKA_URL: kafka:19092
      REDIS_URL: redis:6379
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rafiki-v2

  payments-api-service:
    build:
      context: ../
      dockerfile: ./packages/payments-api-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
    ports:
      - '50052:50052'
    depends_on:
      mongodb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2

  payments-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/payments-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
      PAL_GRPC_URL: pal-api-service:50051
      UV_THREADPOOL_SIZE: 128
      LOG_LEVEL: debug
    depends_on:
      mongodb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      pal-api-service:
        condition: service_started
    networks:
      - rafiki-v2

  payments-event-handler-service:
    build:
      context: ../
      dockerfile: ./packages/payments-event-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2
  notifications-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/notifications-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017/
      WEBHOOK_URL: http://ase-mock-service:3000/webhooks
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    networks:
      - rafiki-v2

  notifications-event-handler-service:
    build:
      context: ../
      dockerfile: ./packages/notifications-event-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      UV_THREADPOOL_SIZE: 128
    depends_on:
      mongodb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2

  ilp-connector-service:
    build:
      context: ../
      dockerfile: ./packages/ilp-connector-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      LOG_LEVEL: debug
      REDIS_URL: redis:6379
      ILP_CONNECTOR_HTTP_PORT: 4000
      ILP_CONNECTOR_PUBLIC_URL: http://ilp-connector-service:4000
    ports:
      - '4000:4000'
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - rafiki-v2
  ase-mock-service:
    build:
      context: ../
      dockerfile: ./packages/ase-mock-service/Dockerfile
    restart: always
    environment:
      HOST: ase-mock-service
      PORT: 3000
      ADMIN_URL: http://admin-api-service:3001
    ports:
      - '3000:3000'
    depends_on:
      - admin-api-service
    networks:
      - rafiki-v2

  ilp-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/ilp-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      LOG_LEVEL: debug
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
      STREAM_SERVER_SECRET: cmFmaWtpLXYyLWRldi1zdHJlYW0tc2VjcmV0LTAwMDE
      ILP_ADDRESS: private.rafiki.a
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    networks:
      - rafiki-v2

  ilp-api-service:
    build:
      context: ../
      dockerfile: ./packages/ilp-api-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
    ports:
      - '50053:50053'
    depends_on:
      init-kafka:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    networks:
      - rafiki-v2

  ilp-event-handler-service:
    build:
      context: ../
      dockerfile: ./packages/ilp-event-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      LOG_LEVEL: debug
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2

  auth-api-service:
    build:
      context: ../
      dockerfile: ./packages/auth-api-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
    ports:
      - '50054:50054'
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2

  auth-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/auth-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
    depends_on:
      mongodb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-v2

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongoPass
    ports:
      - 27017:27017
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - rafiki-v2

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://kafka:9092
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: nc -z localhost 19092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '9092:9092'
    networks:
      - rafiki-v2

  redpanda-console:
    depends_on:
      - kafka
    image: redpandadata/console:latest
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:19092
    ports:
      - 8080:8080
    networks:
      - rafiki-v2
    profiles: [with-observability]

  init-kafka:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    working_dir: /opt/kafka/bin/
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic payment-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic payment-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic asset-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic peer-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ledger-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ledger-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ledger-snapshot-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ledger-state-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic wallet-address-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic fxrate-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ilp-domain-events
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ilp-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic ilp-connector-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic notification-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic auth-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic auth-domain-events
      echo -e '\nSuccessfully created the following topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    networks:
      - rafiki-v2

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
      start_period: 10s
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - rafiki-v2

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'
      - '4318:4318'
    networks:
      - rafiki-v2
    profiles: [with-observability]

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - '9090:9090'
    networks:
      - rafiki-v2
    profiles: [with-observability]

  tempo:
    image: grafana/tempo:latest
    command: '-config.file=/etc/tempo.yaml'
    networks:
      - rafiki-v2
    ports:
      - '3200:3200'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
    profiles: [with-observability]

  grafana:
    image: grafana/grafana:latest
    ports:
      - '4501:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rafiki-v2
    profiles: [with-observability]

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - rafiki-v2
    sysctls:
      net.ipv4.ip_local_port_range: '10240 65535'
    profiles: [with-observability]

networks:
  rafiki-v2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.1.0/24

volumes:
  grafana-data:
  tempo-data:
  mongodb-data:
