name: rafiki-poc
services:
  admin-api-service:
    build:
      context: ../
      dockerfile: ./packages/admin-api-service/Dockerfile
    restart: always
    environment:
      PAL_GRPC_URL: pal-api-service:50051
      PAYMENTS_GRPC_URL: payments-api-service:50052
    ports:
      - '3001:3001'
    depends_on:
      pal-api-service:
        condition: service_started
      payments-api-service:
        condition: service_started
    networks:
      - rafiki-poc

  pal-api-service:
    build:
      context: ../
      dockerfile: ./packages/pal-api-service/Dockerfile
    restart: always
    environment:
      MONGO_URL: mongodb://root:mongoPass@mongodb:27017/
    ports:
      - '50051:50051'
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - rafiki-poc

  payments-api-service:
    build:
      context: ../
      dockerfile: ./packages/payments-api-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
    ports:
      - '50052:50052'
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    networks:
      - rafiki-poc

  payments-command-handler-service:
    build:
      context: ../
      dockerfile: ./packages/payments-command-handler-service/Dockerfile
    restart: always
    environment:
      KAFKA_URL: kafka:19092
      MONGODB_URL: mongodb://root:mongoPass@mongodb:27017
      PAL_GRPC_URL: pal-api-service:50051
      UV_THREADPOOL_SIZE: 128
    depends_on:
      mongodb:
        condition: service_healthy
      init-kafka:
        condition: service_completed_successfully
      pal-api-service:
        condition: service_started
    networks:
      - rafiki-poc

  mongodb:
    image: mongo
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongoPass
    ports:
      - 27017:27017
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - rafiki-poc

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://kafka:9092
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:19093,EXTERNAL://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: nc -z localhost 19092 || exit -1
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 10
    ports:
      - '9092:9092'
    networks:
      - rafiki-poc

  redpanda-console:
    depends_on:
      - kafka
    image: redpandadata/console:latest
    restart: unless-stopped
    environment:
      - KAFKA_BROKERS=kafka:19092
    ports:
      - 8080:8080
    networks:
      - rafiki-poc

  init-kafka:
    image: apache/kafka:4.0.0
    depends_on:
      kafka:
        condition: service_started
    entrypoint: ['/bin/sh', '-c']
    working_dir: /opt/kafka/bin/
    command: |
      "
      # blocks until kafka is reachable
      echo -e 'Existing kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      echo -e '\nCreating kafka topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic audits
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic logs
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic payment-commands
      ./kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --partitions 24 --topic payment-events
      echo -e '\nSuccessfully created the following topics:'
      ./kafka-topics.sh --bootstrap-server kafka:19092 --list
      "
    networks:
      - rafiki-poc

  redis:
    image: redis:latest
    ports:
      - '6379:6379'
    networks:
      - rafiki-poc

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: '--config=/etc/otel-collector-config.yaml'
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - '4317:4317'
      - '4318:4318'
    networks:
      - rafiki-poc

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - '9090:9090'
    networks:
      - rafiki-poc

  tempo:
    image: grafana/tempo:latest
    command: '-config.file=/etc/tempo.yaml'
    networks:
      - rafiki-poc
    ports:
      - '3200:3200'
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:latest
    ports:
      - '4501:3000'
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/dashboards
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - rafiki-poc

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - rafiki-poc
    sysctls:
      net.ipv4.ip_local_port_range: '10240 65535'

networks:
  rafiki-poc:
    driver: bridge
    ipam:
      config:
        - subnet: 10.5.1.0/24

volumes:
  tigerbeetle-data:
  postgres-data:
  grafana-data:
  tempo-data:
  mongodb-data:
