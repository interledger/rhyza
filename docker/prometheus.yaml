scrape_configs:
  - job_name: 'otel-collector'
    scrape_interval: 15s
    static_configs:
      - targets: ['otel-collector:8491']
  - job_name: 'kafka-brokers'
    static_configs:
      - targets:
          - 'kafka-1:9405'
          - 'kafka-2:9405'
          - 'kafka-3:9405'
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
