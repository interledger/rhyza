name: E2E tests

on:
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v6

      - uses: pnpm/action-setup@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64

      # Same Dockerfiles as the release docker-build job. Images stay on this
      # runner as rhyza-<package>, with no registry push and no artifact upload.
      - name: Build images
        run: |
          set -euo pipefail
          mapfile -t packages < <(jq -r '.[]' .github/release-packages.json)
          packages+=(ase-mock-service)
          for package in "${packages[@]}"; do
            echo "Building rhyza-${package}"
            docker buildx build \
              --file "packages/${package}/Dockerfile" \
              --platform linux/amd64 \
              --tag "rhyza-${package}" \
              --load \
              .
          done

          mapfile -t loaded < <(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^rhyza-.*:latest$' || true)
          expected=$(( $(jq 'length' .github/release-packages.json) + 1 ))
          if [[ ${#loaded[@]} -ne "$expected" ]]; then
            echo "Expected ${expected} rhyza-* images, found ${#loaded[@]}" >&2
            printf '%s\n' "${loaded[@]}"
            docker images
            exit 1
          fi
          printf 'Built %s images\n' "${#loaded[@]}"
          printf '%s\n' "${loaded[@]}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin-client-lib
        run: pnpm --filter admin-client-lib build

      - name: Run E2E tests
        env:
          E2E_COMPOSE_PROJECT: rhyza-e2e
          E2E_COMPOSE_LOGS_PATH: ${{ runner.temp }}/e2e-compose-logs.txt
        run: pnpm e2e

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-compose-logs
          path: ${{ runner.temp }}/e2e-compose-logs.txt
          if-no-files-found: warn
          retention-days: 7
