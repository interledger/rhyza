openapi: 3.1.0
info:
  title: Rhyza Webhooks API
  version: 0.0.0
webhooks:
  paymentIntentCreated:
    post:
      summary: Payment intent created
      description: >-
        Sent when a payment intent is created. At this point, the payment
        intent has not yet received any funds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent created
  paymentIntentCompleted:
    post:
      summary: Payment intent completed
      description: >-
        Sent when a payment intent has received its full incoming amount or if it was completed manually.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentIntentEvent'
      responses:
        '200':
          description: Payment intent completed
  paymentCreated:
    post:
      summary: Payment created
      description: >-
        Sent when a payment is created and is awaiting approval. The FSP
        should do any necessary checks (like to verify the sender has sufficient funds) and approve or cancel
        the payment via the Admin API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment created
  paymentCompleted:
    post:
      summary: Payment completed
      description: Sent when a payment has completed successfully.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEvent'
      responses:
        '200':
          description: Payment completed
  paymentFailed:
    post:
      summary: Payment failed
      description: >-
        Sent when a payment failed to send. The FSP should release the sender's funds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paymentEventError'
      responses:
        '200':
          description: Payment failed
  grantRevoked:
    post:
      summary: Grant revoked
      description: Sent when a grant is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/grantEvent'
      responses:
        '200':
          description: Grant revoked

components:
  schemas:
    webhookEvent:
      type: object
      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - payment_intent.created
            - payment_intent.completed
            - payment.created
            - payment.completed
            - payment.failed
            - grant.revoked
        data:
          type: object

    paymentIntentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment_intent.created
                - payment_intent.completed
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - expiresAt
                - receiveAmount
              properties:
                id:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - COMPLETED
                walletAddressId:
                  type: string
                  format: uuid
                incomingAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
                expiresAt:
                  type: string
                  format: date-time

    paymentEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.created
                - payment.completed
            data:
              type: object
              required:
                - id
                - walletAddressId
                - createdAt
                - debitAmount
                - sentAmount
                - receiveAmount
                - state
              properties:
                id:
                  type: string
                  format: uuid
                walletAddressId:
                  type: string
                  format: uuid
                state:
                  type: string
                  enum:
                    - CREATED
                    - PROCESSING
                    - SENDING
                    - CONFIRMED
                    - REJECTED
                    - COMPLETED
                    - CANCELLED
                    - FAILED
                paymentIntentId:
                  type: string
                  format: uuid
                debitAmount:
                  $ref: '#/components/schemas/amount'
                sentAmount:
                  $ref: '#/components/schemas/amount'
                receiveAmount:
                  $ref: '#/components/schemas/amount'
                createdAt:
                  type: string
                  format: date-time
    paymentEventError:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - payment.failed
            data:
              type: object
              required:
                - id
                - paymentIntentId
                - errorName
                - message
              properties:
                id:
                  type: string
                  format: uuid
                paymentIntentId:
                  type: string
                  format: uuid
                errorName:
                  type: string
                message:
                  type: string
    amount:
      type: object
      required:
        - value
        - assetCode
        - assetScale
      properties:
        value:
          type: string
        assetCode:
          type: string
        assetScale:
          type: integer
    baseAccessLimit:
      type: object
      required:
        - receiver
        - assetCode
        - assetScale
      properties:
        receiver:
          type: string
          format: uri
        assetCode:
          type: string
        assetScale:
          type: integer
        interval:
          type: string
    debitAmountAccessLimit:
      allOf:
        - $ref: '#/components/schemas/baseAccessLimit'
        - type: object
          required:
            - debitAmount
          properties:
            debitAmount:
              type: string
              format: uint64
            receiveAmount:
              type: string
              format: uint64
    receiveAmountAccessLimit:
      allOf:
        - $ref: '#/components/schemas/baseAccessLimit'
        - type: object
          required:
            - receiveAmount
          properties:
            debitAmount:
              type: string
              format: uint64
            receiveAmount:
              type: string
              format: uint64
    accessLimit:
      anyOf:
        - $ref: '#/components/schemas/debitAmountAccessLimit'
        - $ref: '#/components/schemas/receiveAmountAccessLimit'
    jsonWebKey:
      type: object
      required:
        - kty
        - kid
        - alg
        - crv
        - x
      properties:
        kty:
          type: string
        kid:
          type: string
        use:
          type: string
        alg:
          type: string
        crv:
          type: string
        x:
          type: string
    grantState:
      type: string
      enum:
        - PROCESSING
        - PENDING
        - APPROVED
        - ISSUED
        - REVOKED
        - REJECTED
    accessAction:
      type: string
      enum:
        - CREATE
        - COMPLETE
        - READ
        - READ_ALL
        - LIST
        - LIST_ALL
    accessItem:
      type: object
      required:
        - type
        - actions
      properties:
        type:
          type: string
          enum:
            - INCOMING_PAYMENT
            - OUTGOING_PAYMENT
            - QUOTE
        limits:
          $ref: '#/components/schemas/accessLimit'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/accessAction'
        identifier:
          type: string
          format: uri
    grantEvent:
      allOf:
        - $ref: '#/components/schemas/webhookEvent'
        - type: object
          properties:
            type:
              type: string
              enum:
                - grant.revoked
            data:
              type: object
              required:
                - id
                - createdAt
                - status
              properties:
                id:
                  type: string
                  format: uuid
                createdAt:
                  type: string
                  format: date-time
                status:
                  $ref: '#/components/schemas/grantState'
                access:
                  type: array
                  items:
                    $ref: '#/components/schemas/accessItem'
                client:
                  oneOf:
                    - type: string
                      format: uri
                    - $ref: '#/components/schemas/jsonWebKey'
                clientName:
                  type: string
                subjectIds:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - format
                    properties:
                      id: 
                        type: string
                      format:
                        type: string
                interaction:
                  type: object
                  required:
                    - createdAt
                    - state
                  properties:
                    createdAt:
                      type: string
                      format: date-time
                    state:
                      type: string
                      enum:
                        - PENDING
                        - APPROVED
                        - REJECTED
